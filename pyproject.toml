[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "customer-service-agent"
version = "0.1.0"
description = "A LangGraph-powered customer service and booking agent"
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "langchain>=0.3.27,<1.0",
    "langchain-core>=0.3.30,<1.0",
    "langchain-openai>=0.3.0,<1.0",
    "langfuse>=2.57.0,<4.0",
    "langgraph>=0.2.60,<1.0",
    "pydantic>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
    "typing-extensions>=4.12,<5.0",
]

[project.scripts]
booking-agent = "customer_service_agent.cli:main"

[tool.poetry]
packages = [{ include = "customer_service_agent" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The default value of `allowed_objects` will change.*:langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]
